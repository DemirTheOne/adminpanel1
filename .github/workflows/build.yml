name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew build
        working-directory: adminpanel_forge_1.20.1_project
      - uses: actions/upload-artifact@v4
        with:
          name: adminpanel-jar
          path: adminpanel_forge_1.20.1_project/build/libs/*.jar
